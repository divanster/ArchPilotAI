name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Ephemeral, job-scoped PostgreSQL. Credentials are throwaway, test-only values.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: archpilot_test
          POSTGRES_USER: archpilot_test
          POSTGRES_PASSWORD: ci-test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U archpilot_test -d archpilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARCHPILOT_TEST_DATABASE_URL: postgresql+psycopg://archpilot_test:ci-test-only-password@localhost:5432/archpilot_test
      ARCHPILOT_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      # Fixtures migrate the empty PostgreSQL database with Alembic, then run
      # API/persistence tests against both SQLite and PostgreSQL.
      - run: pytest -rs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: archpilot_e2e_test
          POSTGRES_USER: archpilot_test
          POSTGRES_PASSWORD: ci-test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U archpilot_test -d archpilot_e2e_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARCHPILOT_DB_HOST: localhost
      ARCHPILOT_DB_PORT: "5432"
      ARCHPILOT_DB_NAME: archpilot_e2e_test
      ARCHPILOT_DB_USER: archpilot_test
      ARCHPILOT_DB_PASSWORD: ci-test-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      # Playwright starts the real backend (after `alembic upgrade head`) and frontend.
      - run: npx playwright test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
